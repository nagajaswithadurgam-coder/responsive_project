<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <style>
        body {
            width:100vw;
            height:100vh;
            display:flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: "muli";
            margin: 0;
            padding: 0;

        }
        .root {
            width: 800px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #252831;
            background:url("Images/bg.png");
        }
        .product {
            width: 680px;
            height: 400px;
            display:flex;
            background-color: #2a2f40;
        }
        .left {
            width:55%;
            height:100%;
            border-radius: 0px 50% 50% 0px;
            background-color: rgb(214, 93, 49);
            position: relative;
        }
        .shoe {
            width: 460px;
            position: absolute;
            top: 50px;
            left: -75px;


        }
        .right {
            width:45%;
            
            padding: 25px;
        }
        .content {
            margin-top: 80px;

        }
        .logo {
            color: rgb(214, 93, 49);
            font-size: 23px;
            font-weight: 600;
        }
        .winter {
            font-size: 20px;
        }
        .men {
            font-size: 20px;
            font-weight: 600;
        }
        .price {
            display: flex;
            gap: 35px;
            margin-top: 20px;
            margin-bottom: 20px ;
        }
        .price1 {
            font-size: 20px;
            font-weight: 600;
        }
        .price2 {
             font-size: 20px;
            font-weight: 600;
            text-decoration: line-through;
            text-decoration-color: red ;
        }
        .size {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .size-num span {
            margin-right: 29px;
        }
        .s {
           font-size: 12px; 
        }
        .color {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-top: 2px;
        }
        .color-box {
            display: flex;
            gap: 35px;
        }
        .yellow {
            width: 15px ;
            height: 15px;
            border-radius: 50%;
            background-color: yellow;
        }
         .black {
            width: 15px ;
            height: 15px;
            border-radius: 50%;
            background-color: black;
        }
         .blue {
            width: 15px ;
            height: 15px;
            border-radius: 50%;
            background-color: skyblue;
        }
        .wm {
            display: flex;
            flex-direction: column;
            line-height: 20px;
        }
        .footer {
          display: flex;
          gap: 50px;  
          margin-left:20px;
          margin-top: 20px;
        }
        .footer span {
            font-size: 12px;
        }

    </style>
</head>
<body>
    <div class="root">
        <div class="product">
            <div class="left" >
                <img class="shoe" src="Images/shoe.png" alt="description" />
            </div>
            <div class="right">
                <span class="logo">Airmax</span>
                <div class="content">
                    <div class="wm">
                        <span class="winter">Winter Collection</span></br>
                    <span class="men">MEN BLACK SNEAKERS</span>
                    </div>
                    <div class="price">
                        <span class="price1">150</span>
                        <span class="price2">200</span>
                    </div>
                    <div class="size">
                        <span class="s">SIZE</span>
                        <div class="size-num">
                            <span>7</span>
                            <span>8</span>
                            <span>9</span>
                            <span>10</span>
                            <span>11</span>
                        </div>
                        </div></br>
                        <div class="color">
                            <span class="s">COLOUR</span>
                            <div class="color-box">
                                <div class="yellow"></div>
                                <div class="black"></div>
                                <div class="blue"></div>
                            </div>
                    </div>
                    <div class="footer"> 
                        <span>Buy Now</span><span>Add to Cart</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
